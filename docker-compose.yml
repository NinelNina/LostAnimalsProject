version: '3.8'

services:
  lostanimals_postgresql:
    image: postgres:14.1

  rabbitmq:
    image: rabbitmq:3.9-management

  milvus:
    image: milvusdb/milvus:v2.3.0

  lostanimals_api:
    image: ${DOCKER_REGISTRY-}lostanimalsapi
    build:
      context: .
      dockerfile: Systems/Api/LostAnimals.Api/Dockerfile
    depends_on:
      - lostanimals_postgresql
      - rabbitmq

  lostanimals_identity:
    image: ${DOCKER_REGISTRY-}lostanimalsidentity
    build:
      context: .
      dockerfile: Systems/Identity/LostAnimals.Identity/Dockerfile
    depends_on:
      - lostanimals_postgresql
      - lostanimals_api

  lostanimals_web:
    image: ${DOCKER_REGISTRY-}lostanimalsweb
    build:
      context: .
      dockerfile: Systems/Web/LostAnimals.Web/Dockerfile
    depends_on:
      - lostanimals_postgresql
      - lostanimals_api

  animal_photosearch_api:
    image: ${DOCKER_REGISTRY-}animalphotosearchapi
    build:
      context: .
      dockerfile: Systems/PhotoSearch/LostAnimals.PhotoSearch/Dockerfile
    depends_on:
      - rabbitmq
      - milvus

volumes:
  pgdata:
  milvusdata:
  storage:

networks:
  shared_lostanimals_net:
    name: lostanimals
    driver: bridge